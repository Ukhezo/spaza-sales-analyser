name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Run the analyser on the sample data
        run: python -m spaza_analyser data/sales_2025.csv --out /tmp/report
      - name: Build the database and run the SQL queries
        run: python -m spaza_analyser.sql_report data/sales_2025.csv --db /tmp/spaza.db --out /tmp/sql_results.md
