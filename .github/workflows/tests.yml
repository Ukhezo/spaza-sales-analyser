name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx ruff
      - name: Lint
        run: ruff check .
      - name: Run tests (analysis, SQL, API and chatbot evaluation)
        run: pytest -q
      - name: Run the analyser on the sample data
        run: python -m spaza_analyser data/sales_2025.csv --out /tmp/report
      - name: Build the database and run the SQL queries
        run: python -m spaza_analyser.sql_report data/sales_2025.csv --db /tmp/spaza.db --out /tmp/sql_results.md

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t spaza-api .
      - name: Start the container
        run: docker run -d --name spaza -p 8000:8000 spaza-api
      - name: Check the API answers
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/summary
          curl -sf -X POST http://localhost:8000/chat \
               -H "Content-Type: application/json" \
               -d '{"question": "Does payday matter?"}'
      - name: Show container logs if something failed
        if: failure()
        run: docker logs spaza
